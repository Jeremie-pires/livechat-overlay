services:
  livechatccb:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    environment:
      DATABASE_URL: file:/data/sqlite.db
      APP_ENV: ${APP_ENV:-production}
      LOG: ${LOG:-info}
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_OWNER_ID: ${DISCORD_OWNER_ID:-}
      API_URL: ${API_URL:-http://localhost:3000}
      DEFAULT_DURATION: ${DEFAULT_DURATION:-5}
      HIDE_COMMANDS_DISABLED: ${HIDE_COMMANDS_DISABLED:-false}
      TZ: Europe/Paris
      COBALT_API_URL: ${COBALT_API_URL:-}
      COBALT_PUBLIC_URL: ${COBALT_PUBLIC_URL:-}
      YTDLP_COOKIES: ${YTDLP_COOKIES:-/cookies/cookies.txt}
      YTDLP_PATH: /usr/local/bin/yt-dlp
      FFPROBE_PATH: /usr/bin/ffprobe
    volumes:
      - livechat_data:/data
      - ./cobalt-cookies:/cookies:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const http=require('http');const req=http.request({host:'127.0.0.1',port:process.env.PORT||3000,path:'/health',timeout:2000},r=>{process.exit(r.statusCode===200?0:1)});req.on('error',()=>process.exit(1));req.end()",
        ]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  cobalt:
    image: ghcr.io/imputnet/cobalt:10
    restart: unless-stopped
    ports:
      - '9000:9000'
    environment:
      # Set to the browser-accessible URL so tunnel URLs are reachable by the overlay client
      API_URL: ${COBALT_PUBLIC_URL:-http://localhost:9000}
      CORS_WILDCARD: '1'
      COOKIE_FILE: /cookies/cookies.txt
    volumes:
      - ./cobalt-cookies:/cookies:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '3'

volumes:
  livechat_data:
