<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiveChatCCB Desktop</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="updateModal" class="update-modal hidden" role="dialog" aria-modal="true" aria-labelledby="updateModalTitle">
      <div class="update-modal-card">
        <div class="update-modal-header">
          <div>
            <p class="update-modal-label">Mise à jour disponible</p>
            <h2 id="updateModalTitle"></h2>
          </div>
        </div>
        <div id="updateModalNotes" class="update-modal-notes"></div>
        <div class="update-modal-actions">
          <button id="updateModalClose" class="btn-secondary">Plus tard</button>
          <button id="updateModalInstall" class="btn-cta">Redémarrer maintenant</button>
        </div>
      </div>
    </div>

    <div class="app-layout">
      <nav class="sidebar">
        <div class="sidebar-logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
            <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
            <circle cx="12" cy="20" r="1" fill="#ffffff" stroke="none"/>
          </svg>
        </div>

        <div class="sidebar-nav">
          <button class="sidebar-btn active" data-tab="status" title="Statut">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
              </svg>
            </span>
          </button>
          <button class="sidebar-btn" data-tab="settings" title="Paramètres overlay">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/>
                <line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/>
                <line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/>
                <line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>
              </svg>
            </span>
          </button>
          <button class="sidebar-btn" data-tab="server" title="Serveur">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <ellipse cx="12" cy="5" rx="9" ry="3"/>
                <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
                <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
              </svg>
            </span>
          </button>
          <button class="sidebar-btn" data-tab="users" title="Utilisateurs connectés">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
              </svg>
            </span>
          </button>
        </div>

        <div class="sidebar-footer">
          <span id="appVersion"></span>
        </div>
      </nav>

      <main class="content">

        <!-- Panel 1 : Statut -->
        <div id="tabStatus" class="tab-panel">
          <div class="panel-card">
            <div class="status-row">
              <span class="status-dot" id="statusDot" data-status="idle"></span>
              <span id="statusText">Prêt</span>
            </div>

            <hr class="divider">

            <button class="btn-discord" id="discordSupportBtn" data-href="https://discord.gg/TON_SERVEUR">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057.1 18.08.11 18.1.133 18.115a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/>
              </svg>
              Support Discord
            </button>

            <hr class="divider">

            <div class="changelog-section">
              <p class="section-title">Mises à jour</p>
              <ul id="changelogList" class="changelog-list" aria-live="polite">
                <li class="changelog-loading">Chargement...</li>
              </ul>
            </div>
          </div>
        </div>

        <!-- Panel 2 : Paramètres overlay -->
        <div id="tabSettings" class="tab-panel hidden">
          <div class="panel-card">
            <div class="card-header-bar card-header-blue">Paramètres overlay</div>

            <div class="activation-zone">
              <button id="toggleOverlayBtn" class="primary-toggle btn-inactive">Activer l'overlay</button>
            </div>

            <hr class="divider">

            <div class="field-row">
              <div class="field">
                <span>Position</span>
                <div class="position-grid" id="positionGrid">
                  <div class="position-cell" data-value="top-left"     title="Haut Gauche"></div>
                  <div class="position-cell" data-value="top-center"   title="Haut Centre"></div>
                  <div class="position-cell" data-value="top-right"    title="Haut Droit"></div>
                  <div class="position-cell" data-value="center-left"  title="Milieu Gauche"></div>
                  <div class="position-cell" data-value="center"       title="Centre"></div>
                  <div class="position-cell" data-value="center-right" title="Milieu Droit"></div>
                  <div class="position-cell" data-value="bottom-left"  title="Bas Gauche"></div>
                  <div class="position-cell" data-value="bottom-center" title="Bas Centre"></div>
                  <div class="position-cell" data-value="bottom-right" title="Bas Droit"></div>
                </div>
                <input type="hidden" id="overlayPosition" value="center" />
              </div>
              <label class="field grow">
                <span>Écran cible</span>
                <select id="screenId"></select>
              </label>
            </div>

            <hr class="divider">

            <div class="field-row">
              <label class="field grow">
                <span>Taille (Largeur)</span>
                <div class="range-box">
                  <input id="overlaySize" type="range" min="400" max="1600" step="20" value="960" />
                  <strong id="sizeValue">960px</strong>
                </div>
              </label>
              <label class="field small-field">
                <span>Volume</span>
                <div class="volume-box">
                  <input id="volume" type="range" min="0" max="100" step="1" />
                  <strong id="volumeValue">100%</strong>
                </div>
                <button id="testSoundBtn" class="small-btn" disabled>Test son</button>
              </label>
            </div>

            <hr class="divider">

            <div class="test-formats-section">
              <span>Tester un format</span>
              <div class="test-buttons-grid">
                <button id="testLandscapeBtn" class="small-btn" disabled>Paysage</button>
                <button id="testSquareBtn"    class="small-btn" disabled>Carré</button>
                <button id="testPortraitBtn"  class="small-btn" disabled>Portrait</button>
              </div>
            </div>

            <div class="obs-url-section hidden" id="obsUrlSection">
              <label for="obsUrlDisplay">URL OBS Browser Source</label>
              <div class="obs-url-row">
                <input id="obsUrlDisplay" type="text" readonly />
                <button id="obsUrlCopyBtn" class="small-btn">Copier</button>
              </div>
            </div>

            <hr class="divider">

            <div class="summary-grid">
              <div><span>Statut</span><strong id="statusSummary">Prêt</strong></div>
              <div><span>Fenêtre</span><strong id="windowSummary">Inactive</strong></div>
              <div><span>Placement</span><strong id="screenSummary">Écran principal</strong></div>
              <div><span>Connectés</span><strong id="presenceSummary">—</strong></div>
            </div>
          </div>
        </div>

        <!-- Panel 3 : Serveur -->
        <div id="tabServer" class="tab-panel hidden">
          <div class="panel-card">
            <div class="card-header-bar card-header-yellow">Configuration serveur</div>

            <label class="field">
              <span>URL du serveur backend</span>
              <input id="backendUrl" type="text" placeholder="http://localhost:3000" />
            </label>
            <label class="field">
              <span>ID de la Guild Discord</span>
              <input id="guildId" type="text" placeholder="123456789012345678" />
            </label>
            <label class="field">
              <span>Token client (depuis /client)</span>
              <input id="clientToken" type="password" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" autocomplete="off" />
            </label>
            <label class="field">
              <span>Port serveur OBS local</span>
              <input id="localServerPort" type="number" min="1024" max="65535" placeholder="3001" />
            </label>

            <hr class="divider">

            <div class="toggles">
              <label class="toggle">
                <input id="autoConnect" type="checkbox" />
                <span>Connexion automatique au démarrage</span>
              </label>
              <label class="toggle">
                <input id="launchAtStartup" type="checkbox" />
                <span>Lancer au démarrage de Windows</span>
              </label>
              <label class="toggle">
                <input id="startMinimized" type="checkbox" />
                <span>Démarrer dans le tray</span>
              </label>
            </div>

            <hr class="divider">

            <div id="testResultBox" class="test-result-box hidden">
              <span id="testResultIcon"></span>
              <span id="testResultText"></span>
            </div>

            <div class="actions">
              <button id="testConnBtn" class="btn-secondary grow">Tester la connexion</button>
              <button id="saveConfigBtn" class="btn-cta grow">Enregistrer</button>
            </div>
          </div>
        </div>

        <!-- Panel 4 : Utilisateurs -->
        <div id="tabUsers" class="tab-panel hidden">
          <div class="panel-card">
            <div class="card-header-bar card-header-yellow">Utilisateurs connectés</div>
            <div id="userList" class="user-list" role="list" aria-live="polite" aria-relevant="additions removals"></div>
          </div>
        </div>

      </main>
    </div>

    <script src="./renderer.js"></script>
  </body>
</html>
